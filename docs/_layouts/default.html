<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--brand:#002C5F;--tint:#DCE5F0;--text:#222;--muted:#6a6a6a;--line:#e3e8ef;--bg:#fff;--code:#f4f6f9;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 "Pretendard Variable",Pretendard,system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--brand);text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:#fff;padding:8px 12px;z-index:9}
header.bar{border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.mark{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--brand);text-decoration:none}
.mark i{display:inline-block;width:22px;height:8px;border-radius:4px;background:var(--tint);position:relative}
.mark i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:60%;border-radius:4px;background:var(--brand)}
nav.bar-nav{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
nav.bar-nav a{color:var(--muted);text-decoration:none;padding:4px 0}
nav.bar-nav a:hover{color:var(--brand);text-decoration:underline}
main{max-width:760px;margin:0 auto;padding:32px 16px 72px}
h1{font-size:clamp(26px,5vw,34px);line-height:1.3;margin:24px 0 8px;color:var(--brand);letter-spacing:-.01em}
h2{font-size:22px;line-height:1.4;margin:48px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
h3{font-size:18px;margin:32px 0 8px}
h4{font-size:16px;margin:24px 0 8px}
img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
p{margin:12px 0}
blockquote{margin:16px 0;padding:8px 16px;border-left:4px solid var(--tint);color:var(--muted);background:#fafbfc;border-radius:0 10px 10px 0}
blockquote p{margin:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:40px 0 16px}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:.1em .35em;border-radius:6px}
pre{background:var(--code);border-radius:var(--r);padding:14px 16px;overflow:auto;line-height:1.6;font-size:14px}
pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:16px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;line-height:1.55}
th{background:var(--tint);color:var(--brand)}
td img{min-width:160px}
li{margin:4px 0}
footer.foot{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>
<header class="bar"><div class="bar-in">
  <a class="mark" href="{{ '/' | relative_url }}"><i aria-hidden="true"></i>동반차</a>
  <nav class="bar-nav" aria-label="가이드 목차">
    <a href="{{ '/guide/features.html' | relative_url }}">기능</a>
    <a href="{{ '/guide/structure.html' | relative_url }}">구조</a>
    <a href="{{ '/guide/tech.html' | relative_url }}">기술</a>
    <a href="{{ '/guide/m1-model.html' | relative_url }}">판정 모델</a>
    <a href="{{ '/guide/debug-app.html' | relative_url }}">디버그 앱</a>
  </nav>
</div></header>
<main id="content">
{{ content }}
</main>
<footer class="foot"><a href="{{ '/' | relative_url }}">안내 페이지로</a> · <a href="https://github.com/hyundai-app-devchallenge/drive-diary">GitHub</a></footer>
</body>
</html>
