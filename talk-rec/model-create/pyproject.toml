[project]
name = "drive-diary-model-create"
version = "0.1.0"
description = "추억 후보 판별 모델의 데이터·학습 공통 도구"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
base = ["pytest==8.4.2"]
pipeline = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "yt-dlp[default]==2026.10.26",
    "av==16.1.0",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.28.1.4",
]
train = [
    "torch==2.10.0+cu128",
    "transformers==4.57.3",
    "tokenizers==0.22.1",
    "onnx==1.19.1",
    "onnxruntime==1.23.2",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
]
demo = [
    "speechbrain==1.0.3",
    "torchaudio==2.10.0+cu128",
    "numpy==2.2.6",
    "av==16.1.0",
    "transformers==4.57.3",
]

[tool.uv]
package = false
default-groups = ["base"]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
