<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="skim-token" content="{{TOKEN}}"><title>차 안 가족 대화 · 훑어보기</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p>합성 대화 데모 · 사람 검토</p><h1>차 안에서 들릴 법한가요?</h1><div id="progress" aria-live="polite"></div></header>
<section aria-label="모델이 보는 전사"><div class="row"><h2>음성 인식 전사</h2><span id="identity"></span></div><ol id="transcript"></ol></section>
<section><h2>읽고 판단해 주세요</h2><p>1. 실제 차 안 가족 대화처럼 들리나요?</p><div class="choices" id="real"><button data-value="yes">Y · 실제 같음</button><button data-value="no">N · 어색함</button><button data-value="maybe">M · 애매</button></div>
<p>2. 내가 보기엔 어떤 묶음인가요?</p><div class="choices" id="verdict"><button data-value="story">1 · 이야기</button><button data-value="moment">2 · 한 줄 순간</button><button data-value="none">3 · 없음</button></div>
<p class="hint">둘 다 고르면 저장하고 다음으로 넘어갑니다. 코멘트는 선택 전에 적어 주세요.</p>
<label for="comment">C · 코멘트</label><textarea id="comment" maxlength="2000" rows="2" placeholder="어떤 말투나 흐름이 어색했나요?"></textarea></section>
<nav><button id="original">O · 화자 달린 원본 펼치기</button><button id="label">L · 의도 라벨 표시</button></nav>
<section id="clean" hidden><h2>깨끗한 원본</h2><div id="clean-lines"></div></section>
<section id="intended" hidden><h2>의도 라벨과 장면 카드</h2><p id="label-text"></p><pre id="card"></pre></section>
<footer><button id="prev">K · 이전</button><span id="status" role="status" aria-live="polite"></span><button id="next">J · 다음</button></footer>
<p class="hint">원본과 의도 라벨을 연 여부도 저장합니다. 화면 밖으로 전송되는 데이터는 없습니다.</p></main></body></html>
